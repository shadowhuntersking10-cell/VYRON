<!DOCTYPE html>
<html lang="uz" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2447" />
  <title>VYRON — Digital Gaming Marketplace</title>
  <meta name="description" content="VYRON — game currency, top-ups and digital products. Secure automated fulfillment." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/soft.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B2447'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='800' fill='%235AB2F7' text-anchor='middle' font-family='Arial'%3EV%3C/text%3E%3C/svg%3E" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="container topbar-row">
        <a class="brand" href="#/" aria-label="VYRON">
          <span class="brand-mark">V</span>
          <span class="brand-name">VYRON</span>
        </a>
        <nav class="nav-links" id="nav-links">
          <a href="#/" data-i18n="nav_home"></a>
          <a href="#/games" data-i18n="nav_games"></a>
          <a href="#/support" data-i18n="nav_support"></a>
        </nav>
        <div class="topbar-actions">
          <form class="search-box soft-inset" id="search-form" role="search">
            <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search-input" type="search" autocomplete="off" data-i18n-placeholder="search_placeholder" />
          </form>
          <div class="lang-switch" id="lang-switch">
            <button class="chip" data-lang="uz">UZ</button>
            <button class="chip" data-lang="en">EN</button>
            <button class="chip" data-lang="ru">RU</button>
          </div>
          <button class="icon-btn soft" id="theme-toggle" aria-label="theme">
            <span class="theme-ico">🌙</span>
          </button>
          <a class="icon-btn soft" id="cart-btn" href="#/cart" aria-label="cart">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6 5 3H2"/></svg>
            <span class="badge" id="cart-count" hidden>0</span>
          </a>
          <a class="icon-btn soft" id="account-btn" href="#/account" aria-label="account">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          </a>
          <button class="icon-btn soft menu-btn" id="menu-btn" aria-label="menu">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
      <div class="mobile-menu soft-card" id="mobile-menu" hidden>
        <a href="#/" data-i18n="nav_home"></a>
        <a href="#/games" data-i18n="nav_games"></a>
        <a href="#/support" data-i18n="nav_support"></a>
        <a href="#/account" data-i18n="nav_account"></a>
        <a href="#/cart" data-i18n="nav_cart"></a>
        <a href="#/admin" id="mobile-admin-link" hidden data-i18n="nav_admin"></a>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="footer">
      <div class="container footer-grid">
        <div>
          <div class="brand footer-brand"><span class="brand-mark">V</span><span class="brand-name">VYRON</span></div>
          <p class="muted" data-i18n="footer_tagline"></p>
        </div>
        <div>
          <h4 data-i18n="footer_market"></h4>
          <a href="#/games" data-i18n="nav_games"></a>
          <a href="#/cart" data-i18n="nav_cart"></a>
          <a href="#/account" data-i18n="nav_account"></a>
        </div>
        <div>
          <h4 data-i18n="footer_help"></h4>
          <a href="#/support" data-i18n="nav_support"></a>
          <a href="#/orders" data-i18n="nav_orders"></a>
        </div>
        <div>
          <h4 data-i18n="footer_trust"></h4>
          <p class="muted small" data-i18n="footer_trust_text"></p>
        </div>
      </div>
      <div class="container footer-bottom">
        <span class="muted small">© <span id="year"></span> VYRON</span>
        <span class="muted small" data-i18n="footer_rights"></span>
      </div>
    </footer>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
