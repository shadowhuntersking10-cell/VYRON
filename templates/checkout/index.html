{% extends "base.html" %}
{% block title %}Checkout - VYRON{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
    <h1 class="section-title">🛒 Checkout</h1>
    <div style="display: grid; grid-template-columns: 1fr 360px; gap: 32px; margin-top: 24px;">
        <div class="card" style="padding: 24px;">
            <h3 style="font-weight: 700; margin-bottom: 16px;">Your Cart</h3>
            <div id="cartItems">Loading cart...</div>
        </div>
        <div class="checkout-summary">
            <h3 style="font-weight: 700; margin-bottom: 16px;">Summary</h3>
            <div id="checkoutSummary">Loading...</div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 16px; padding: 14px;" onclick="proceedCheckout()">Proceed to Pay</button>
        </div>
    </div>
</div>

<script>
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cartItems');
    const summary = document.getElementById('checkoutSummary');
    
    if (!cart.length) {
        container.innerHTML = '<p>Cart is empty. <a href="/games" style="color: var(--blue);">Browse games</a></p>';
        summary.innerHTML = 'No items';
        return;
    }
    
    container.innerHTML = cart.map(item => `
        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-light);">
            <span>Product #${item.product_id} x ${item.quantity}</span>
            <button onclick="removeFromCart(${item.product_id})" style="color: #DC2626; background: none; border: none; cursor: pointer;">Remove</button>
        </div>
    `).join('');
    
    summary.innerHTML = `
        <div class="checkout-row"><span>Items</span><span>${cart.length}</span></div>
        <div class="checkout-row"><span>Subtotal</span><span>Calculated at checkout</span></div>
    `;
}

function removeFromCart(id) {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart = cart.filter(i => i.product_id !== id);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

renderCart();
</script>
{% endblock %}
