{% extends "base.html" %}
{% block title %}{{ t('nav.games') }} — VYRON{% endblock %}
{% block content %}
<h1>🎮 {{ t('nav.games') }}</h1>
<div class="grid cards" id="gamesGrid">
{% for g in games %}<a class="card soft-out game-card" href="/games/{{ g.slug }}"><div class="glogo">{{ g.title[:2] }}</div><b>{{ g.title }}</b><span class="muted">{{ g.description[:80] if g.description else '' }}</span></a>{% else %}<div class="empty-state soft-in"><div class="empty-ico">🎮</div><p>{{ t('common.empty') }}</p></div>{% endfor %}
</div>
{% endblock %}
