{% extends "base.html" %}
{% block title %}{{ t('nav.support') }} — VYRON{% endblock %}
{% block content %}
<h1>🆘 {{ t('nav.support') }}</h1>
<div class="duo">
<section class="card soft-out"><h2>New ticket</h2>
<form id="ticketForm" class="stack">
<input class="input soft-in" name="subject" placeholder="Subject" required minlength="3">
<select class="select soft-in" name="category"><option value="general">General</option><option value="order">Order</option><option value="payment">Payment</option><option value="seller">Seller</option></select>
<textarea class="input soft-in" name="body" placeholder="Describe your issue" required></textarea>
<button class="btn btn-primary">{{ t('common.save') }}</button>
</form></section>
<section class="card soft-out"><h2>My tickets</h2><div id="ticketList" class="stack"><p class="muted">{{ t('common.loading') }}</p></div></section>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/support.js"></script>{% endblock %}
