{% extends "base.html" %}
{% block title %}Login - VYRON{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-desc">Login to your VYRON account to continue gaming</p>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="/api/auth/login">
            <div class="form-group">
                <label class="form-label">Email or Username</label>
                <input type="text" name="email_or_username" class="form-input" placeholder="your@email.com or username" required value="{{ email_or_username or '' }}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
                    <input type="checkbox" name="remember_me" value="true"> Remember me
                </label>
                <a href="/forgot-password" style="font-size: 13px; color: var(--blue); text-decoration: none;">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Login</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="/register">Register</a>
        </div>
        
        <div style="margin-top: 24px; text-align: center;">
            <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px;">Or continue with</p>
            <div id="telegramLogin"></div>
            <script>
                // Telegram login widget placeholder
                // In production, add Telegram Login Widget here
            </script>
        </div>
    </div>
</div>
{% endblock %}
