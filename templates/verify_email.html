{% extends "base.html" %}
{% block title %}{{ t('auth.verify_email_title') }}{% endblock %}

{% block content %}
<div class="container-narrow auth-wrap">
  <div class="card auth-card text-center">
    <div style="font-size:2.6rem">📬</div>
    <h1 class="auth-title">{{ t('auth.verify_email_title') }}</h1>
    <p class="auth-sub">{{ t('auth.verify_text') }}</p>
    <div id="verify-status" class="loading-overlay"><span class="spinner"></span>{{ t('common.loading') }}</div>
    <div id="verify-actions" class="stack mt-2 hidden">
      <a class="btn btn-primary btn-block" href="/login">{{ t('nav.login') }}</a>
      <button id="resend-verify" class="btn btn-block">{{ t('auth.verify_resend') }}</button>
    </div>
  </div>
</div>
<script id="verify-token" type="application/json">{{ {'token': verify_token} | tojson }}</script>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/auth.js"></script>
{% endblock %}
