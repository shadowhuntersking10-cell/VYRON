{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h1>🔐 {{ t('security', lang) }}</h1>
  <form id="password-form">
    <div class="form-err"></div>
    <div class="field"><label>{{ t('current_password', lang) }}</label><input class="input" type="password" name="current_password" required></div>
    <div class="field"><label>{{ t('new_password', lang) }}</label><input class="input" type="password" name="new_password" required minlength="8"></div>
    <div class="field"><label>{{ t('password_confirm', lang) }}</label><input class="input" type="password" name="new_password_confirm" required minlength="8"></div>
    <button class="btn btn-primary btn-block" type="submit">{{ t('save', lang) }}</button>
  </form>
</div>
{% endblock %}
