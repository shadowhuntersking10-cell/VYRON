{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_password') }}{% endblock %}

{% block content %}
<div class="container-narrow auth-wrap">
  <div class="card auth-card">
    <h1 class="auth-title">{{ t('auth.forgot_password') }}</h1>
    <p class="auth-sub">{{ t('auth.reset_subtitle') }}</p>
    <form id="forgot-form" novalidate>
      <div class="field">
        <label class="field-label" for="email">{{ t('auth.email') }}</label>
        <input id="email" class="input" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">{{ t('auth.send_reset_link') }}</button>
    </form>
    <div class="auth-switch"><a href="/login">{{ t('nav.login') }}</a></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/auth.js"></script>
{% endblock %}
