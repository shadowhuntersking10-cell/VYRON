{% extends "base.html" %}
{% block title %}Donations - VYRON{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
    <h1 class="section-title">💝 Donations</h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">Support your favorite creators</p>
    
    <div class="grid grid-3">
        {% for profile in profiles %}
        <a href="/donations/{{ profile.username }}" class="card" style="padding: 20px; text-decoration: none; color: inherit;">
            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 12px;">
                <img src="{{ profile.avatar_url or '/static/images/avatars/default.png' }}" style="width: 48px; height: 48px; border-radius: 50%;">
                <div>
                    <div style="font-weight: 700;">{{ profile.display_name }}</div>
                    <div style="font-size: 12px; color: var(--text-secondary);">@{{ profile.username }}</div>
                </div>
            </div>
            <p style="font-size: 13px; color: var(--text-secondary);">{{ profile.bio or '' }}</p>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
