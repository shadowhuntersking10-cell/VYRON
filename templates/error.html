{% extends "base.html" %}
{% block title %}{{ status }} — {{ site_name }}{% endblock %}
{% block content %}
<section class="page-section" style="min-height:50vh">
  <div class="container">
    <div class="card text-center" style="max-width:560px;margin:3rem auto;padding:3rem 2rem">
      <div style="font-size:4rem;font-weight:900;background:linear-gradient(135deg,var(--vyron-blue-light),var(--vyron-blue-deep));-webkit-background-clip:text;background-clip:text;color:transparent">{{ status }}</div>
      <h1 class="fw-800 mt-1">{{ heading }}</h1>
      <p class="text-soft mt-2">{{ message }}</p>
      {% if code %}<div class="mt-1"><span class="badge mono">{{ code }}</span></div>{% endif %}
      <div class="mt-3">
        <a class="btn btn-primary" href="/">{{ t('nav.home') }}</a>
        <a class="btn" href="/support">{{ t('nav.support') }}</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
