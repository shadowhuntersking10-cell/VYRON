{% extends "base.html" %}
{% block title %}My Orders - VYRON{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
    <h1 class="section-title">📦 My Orders</h1>
    
    <div id="ordersList" style="margin-top: 24px;">
        <div class="card" style="padding: 40px; text-align: center;">
            <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
            <p>Loading orders...</p>
        </div>
    </div>
</div>

<script>
async function loadOrders() {
    try {
        const res = await fetch('/api/orders/');
        const data = await res.json();
        
        if (!data.items || data.items.length === 0) {
            document.getElementById('ordersList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <div class="empty-title">No orders yet</div>
                    <p>Your orders will appear here after purchase</p>
                    <a href="/games" class="btn btn-primary" style="margin-top: 16px;">Explore Games</a>
                </div>
            `;
            return;
        }
        
        document.getElementById('ordersList').innerHTML = data.items.map(order => `
            <div class="card" style="padding: 20px; margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                    <div>
                        <div style="font-weight: 700;">${order.order_number}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${new Date(order.created_at).toLocaleString()}</div>
                    </div>
                    <span class="ticket-status ${order.status.toLowerCase()}">${order.status}</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 600;">${order.total_amount} ${order.currency}</span>
                    <span style="font-size: 12px; color: var(--text-secondary);">${order.payment_provider || ''}</span>
                </div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('ordersList').innerHTML = `<div class="alert alert-error">Failed to load orders: ${e.message}</div>`;
    }
}
loadOrders();
</script>
{% endblock %}
