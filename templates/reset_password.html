{% extends "base.html" %}
{% block title %}{{ t('auth.reset_password') }}{% endblock %}

{% block content %}
<div class="container-narrow auth-wrap">
  <div class="card auth-card">
    <h1 class="auth-title">{{ t('auth.reset_password') }}</h1>
    <p class="auth-sub">{{ t('auth.reset_subtitle') }}</p>
    <form id="reset-form" novalidate>
      <div class="field">
        <label class="field-label" for="new-password">{{ t('auth.new_password') }}</label>
        <input id="new-password" class="input" type="password" minlength="8" autocomplete="new-password" required>
        <span class="field-hint">{{ t('auth.password_rules') }}</span>
      </div>
      <div class="field">
        <label class="field-label" for="confirm-password">{{ t('auth.confirm_password') }}</label>
        <input id="confirm-password" class="input" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">{{ t('auth.reset_password') }}</button>
    </form>
  </div>
</div>
<script id="reset-token" type="application/json">{{ {'token': reset_token} | tojson }}</script>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/auth.js"></script>
{% endblock %}
