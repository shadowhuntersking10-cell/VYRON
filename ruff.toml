line-length = 140
target-version = "py311"
exclude = ["migrations", ".venv", "node_modules"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends() in default arguments is the framework idiom
  "UP006",   # keep typing.Optional/List/Dict style (codebase-wide convention)
  "UP035",   # ditto — deprecated-import warnings for typing aliases
  "UP045",   # ditto — Optional[X] vs X | None
  "E501",    # long lines are tolerated (JSON-ish payloads, serializers)
  "E731",
  "SIM102", "SIM103", "SIM105", "SIM108", "SIM114", "SIM117",
  "E741",    # `l` used for listing locals — reads fine in context
  "UP007", "UP042",
  "B905",
  "RUF059",  # unused unpacked vars in tuple assignments
  "RUF019",  # key-in-dict checks
  "B904",
  "S110",
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
"vyron/db/models/*" = ["RUF012"]
"migrations/*" = ["ALL"]
